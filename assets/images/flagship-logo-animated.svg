<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" role="img" aria-label="Flagship '22 — Sailboat Logo">
  <defs>

    <!-- ── Gradients matching the blue/cyan/navy palette ── -->
    <linearGradient id="gCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#29c8f5"/>
      <stop offset="100%" stop-color="#0298f9"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0298f9"/>
      <stop offset="100%" stop-color="#2244aa"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a2e7a"/>
      <stop offset="100%" stop-color="#0d1b5e"/>
    </linearGradient>
    <linearGradient id="gLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7ee8fa"/>
      <stop offset="100%" stop-color="#29c8f5"/>
    </linearGradient>

    <!-- ── Clip paths — left-to-right sweep per layer ── -->
    <!-- Mast: bottom-to-top -->
    <clipPath id="cmast">
      <rect x="0" y="500" width="500" height="500">
        <animate attributeName="y" from="500" to="0"
          dur="0.45s" begin="0.1s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Main sail body — left sweep -->
    <clipPath id="csail">
      <rect x="-500" y="0" width="500" height="500">
        <animate attributeName="x" from="-500" to="0"
          dur="0.6s" begin="0.3s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Ribbon trails group 1 (top ribbons) -->
    <clipPath id="cr1">
      <rect x="-500" y="0" width="500" height="500">
        <animate attributeName="x" from="-500" to="0"
          dur="0.55s" begin="0.55s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Ribbon trails group 2 (mid ribbons) -->
    <clipPath id="cr2">
      <rect x="-500" y="0" width="500" height="500">
        <animate attributeName="x" from="-500" to="0"
          dur="0.55s" begin="0.75s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Ribbon trails group 3 (bottom ribbons) -->
    <clipPath id="cr3">
      <rect x="-500" y="0" width="500" height="500">
        <animate attributeName="x" from="-500" to="0"
          dur="0.55s" begin="0.95s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- Hull sweep -->
    <clipPath id="chull">
      <rect x="-500" y="0" width="500" height="500">
        <animate attributeName="x" from="-500" to="0"
          dur="0.5s" begin="1.1s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

  </defs>

  <!-- ════════════════════════════════════════════════
       ALL SHAPES — wrapped in sail-rock group
  ════════════════════════════════════════════════ -->
  <g id="logo-root" style="transform-origin: 50% 85%; animation: sail-rock 5s ease-in-out infinite; animation-delay: 2.2s;">

    <!-- ── MAST ── tall vertical black bar -->
    <rect x="286" y="68" width="14" height="290"
          fill="#0a0a0a" rx="3"
          clip-path="url(#cmast)"/>

    <!-- ── MAIN SAIL ── large triangle right side, filled with horizontal wave stripes ── -->
    <g clip-path="url(#csail)">
      <!-- Outer sail shape -->
      <path d="M 293 75 L 430 320 L 200 370 L 200 200 Z" fill="#1a2e7a"/>

      <!-- Wave stripes inside sail — cyan/blue/navy bands -->
      <clipPath id="csailinner">
        <path d="M 293 75 L 430 320 L 200 370 L 200 200 Z"/>
      </clipPath>
      <g clip-path="url(#csailinner)">
        <path d="M 200 145 Q 310 135, 410 155 L 430 175 Q 310 160, 200 168 Z" fill="#29c8f5" opacity="0.9"/>
        <path d="M 200 168 Q 315 165, 428 185 L 430 205 Q 316 188, 200 190 Z" fill="#7ee8fa" opacity="0.7"/>
        <path d="M 200 200 Q 318 198, 430 215 L 430 240 Q 318 222, 200 222 Z" fill="#0298f9" opacity="0.85"/>
        <path d="M 200 230 Q 320 232, 430 250 L 428 275 Q 318 258, 200 256 Z" fill="#1a2e7a" opacity="0.9"/>
        <path d="M 200 265 Q 322 268, 426 285 L 420 308 Q 315 292, 200 292 Z" fill="#29c8f5" opacity="0.8"/>
        <path d="M 200 300 Q 318 302, 418 318 L 406 336 Q 305 322, 200 322 Z" fill="#0298f9" opacity="0.75"/>
        <path d="M 200 330 Q 305 333, 400 346 L 380 366 Q 290 356, 200 356 Z" fill="#1a2e7a" opacity="0.85"/>
        <path d="M 200 115 Q 285 100, 360 115 L 370 138 Q 282 126, 200 140 Z" fill="#7ee8fa" opacity="0.65"/>
      </g>
      <!-- Sail outline -->
      <path d="M 293 75 L 430 320 L 200 370 L 200 200 Z"
            fill="none" stroke="#0a0a0a" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- ── RIBBON TRAILS — top (streaming left from mast top) ── -->
    <g clip-path="url(#cr1)">
      <!-- Top ribbon 1 — thin cyan arc -->
      <path d="M 290 88 C 240 82, 170 75, 110 68 C 105 64, 115 60, 122 63 C 178 70, 248 78, 288 82 Z"
            fill="#29c8f5" opacity="0.9"/>
      <!-- Top ribbon 2 — navy below -->
      <path d="M 290 105 C 235 98, 158 88, 88 78 C 82 74, 90 68, 97 71 C 164 82, 240 92, 288 99 Z"
            fill="#1a2e7a" opacity="0.85"/>
      <!-- Top ribbon 3 — light cyan sliver -->
      <path d="M 290 118 C 245 112, 188 104, 140 95 C 135 93, 140 89, 146 91 C 192 100, 248 108, 288 114 Z"
            fill="#7ee8fa" opacity="0.7"/>
    </g>

    <!-- ── RIBBON TRAILS — mid ── -->
    <g clip-path="url(#cr2)">
      <!-- Mid ribbon 1 — wide cyan -->
      <path d="M 288 210 C 238 208, 170 202, 100 190 C 92 185, 96 175, 106 178 C 172 190, 238 196, 286 200 Z"
            fill="#0298f9" opacity="0.85"/>
      <!-- Mid ribbon 2 — navy -->
      <path d="M 288 228 C 230 224, 158 216, 86 200 C 78 196, 82 185, 92 188 C 160 204, 232 212, 286 216 Z"
            fill="#1a2e7a" opacity="0.8"/>
      <!-- Mid ribbon 3 — thin light -->
      <path d="M 288 245 C 240 241, 180 234, 118 222 C 112 218, 117 212, 124 215 C 184 227, 242 234, 286 238 Z"
            fill="#29c8f5" opacity="0.65"/>
    </g>

    <!-- ── RIBBON TRAILS — bottom ── -->
    <g clip-path="url(#cr3)">
      <!-- Bottom ribbon 1 — wide navy -->
      <path d="M 286 330 C 232 328, 160 320, 88 305 C 78 300, 84 288, 96 292 C 164 308, 234 316, 284 320 Z"
            fill="#1a2e7a" opacity="0.9"/>
      <!-- Bottom ribbon 2 — cyan -->
      <path d="M 286 350 C 238 348, 170 340, 100 325 C 91 320, 97 308, 108 312 C 174 328, 240 336, 284 340 Z"
            fill="#0298f9" opacity="0.8"/>
      <!-- Bottom ribbon 3 — thin light -->
      <path d="M 284 366 C 244 362, 190 354, 130 340 C 123 336, 128 328, 136 331 C 194 346, 246 354, 282 358 Z"
            fill="#29c8f5" opacity="0.6"/>
    </g>

    <!-- ── HULL ── boat bottom -->
    <g clip-path="url(#chull)">
      <path d="M 168 372 Q 300 400, 435 372 L 420 392 Q 300 418, 182 392 Z"
            fill="#1a2e7a"/>
      <path d="M 168 372 Q 300 400, 435 372 L 420 392 Q 300 418, 182 392 Z"
            fill="none" stroke="#0a0a0a" stroke-width="4" stroke-linejoin="round"/>
      <!-- Hull wave glint -->
      <path d="M 200 378 Q 300 390, 408 378 Q 360 396, 240 396 Q 210 392, 200 378 Z"
            fill="#29c8f5" opacity="0.3"/>
    </g>

  </g>

  <!-- ── CSS for sail-rock ── -->
  <style>
    @keyframes sail-rock {
      0%   { transform: rotate(0deg)    translateY(0px);  }
      25%  { transform: rotate(0.7deg)  translateY(-3px); }
      50%  { transform: rotate(0deg)    translateY(-5px); }
      75%  { transform: rotate(-0.7deg) translateY(-3px); }
      100% { transform: rotate(0deg)    translateY(0px);  }
    }
  </style>

</svg>
